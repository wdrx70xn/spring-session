name: Rebuild Search Index
'on':
  schedule:
  - cron: 0 10 * * *
  workflow_dispatch: null
permissions: read-all
jobs:
  build:
    if: github.repository_owner == 'wdrx70xn'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: docs-build
        fetch-depth: 1
    - name: Dispatch
      env:
        GH_TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN }}
      run: gh workflow run rebuild-search-index.yml -r $(git rev-parse --abbrev-ref
        HEAD)
